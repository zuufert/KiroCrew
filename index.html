<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101610" />
    <title>贪吃蛇 · Snake</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101610;
        color: #eef4e8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px 16px;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(91 143 53 / 16%), transparent 48%),
          #101610;
      }

      button {
        color: inherit;
        font: inherit;
      }

      .game {
        width: min(100%, 560px);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #9eaf93;
        font-size: 0.72rem;
        font-weight: 750;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.25rem);
        letter-spacing: -0.07em;
        line-height: 1;
      }

      h1 span {
        color: #a4e56b;
      }

      .intro {
        margin: 12px 0 24px;
        color: #aab5a2;
        font-size: 0.94rem;
      }

      .scoreboard {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-bottom: 12px;
      }

      .score-label {
        display: block;
        margin-bottom: 3px;
        color: #9eaf93;
        font-size: 0.68rem;
        font-weight: 750;
        letter-spacing: 0.16em;
      }

      .score {
        color: #c9f49e;
        font-variant-numeric: tabular-nums;
        font-size: 1.65rem;
        font-weight: 800;
        line-height: 1;
      }

      .status {
        color: #aab5a2;
        font-size: 0.82rem;
        text-align: right;
      }

      .board-frame {
        overflow: hidden;
        padding: 9px;
        border: 1px solid #33402e;
        border-radius: 18px;
        background: #182017;
        box-shadow: 0 24px 80px rgb(0 0 0 / 35%), 0 0 36px rgb(145 212 91 / 6%);
      }

      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 11px;
        background: #131b12;
        touch-action: none;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      .action {
        min-height: 46px;
        border: 1px solid #3b4935;
        border-radius: 12px;
        background: #1b2519;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 700;
        transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
      }

      .action:hover {
        border-color: #83b75a;
        background: #24311f;
      }

      .action:active {
        transform: translateY(1px);
      }

      .action:focus-visible,
      .direction:focus-visible {
        outline: 2px solid #c9f49e;
        outline-offset: 3px;
      }

      .action-primary {
        flex: 1;
        border-color: #a4e56b;
        background: #a4e56b;
        color: #172012;
      }

      .action-primary:hover {
        border-color: #b7f18a;
        background: #b7f18a;
      }

      .action-secondary {
        padding: 0 18px;
      }

      .bottom-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-top: 17px;
      }

      .hint {
        margin: 0;
        color: #8e9b86;
        font-size: 0.76rem;
        line-height: 1.6;
      }

      .dpad {
        display: grid;
        grid-template: repeat(2, 36px) / repeat(3, 36px);
        gap: 4px;
      }

      .direction {
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid #394735;
        border-radius: 9px;
        background: #1b2519;
        color: #d6e5cb;
        cursor: pointer;
        font-size: 1rem;
      }

      .direction:hover {
        border-color: #83b75a;
        background: #24311f;
      }

      .up {
        grid-area: 1 / 2;
      }

      .left {
        grid-area: 2 / 1;
      }

      .down {
        grid-area: 2 / 2;
      }

      .right {
        grid-area: 2 / 3;
      }

      @media (max-width: 420px) {
        body {
          padding: 22px 14px;
        }

        .bottom-row {
          align-items: start;
        }

        .hint {
          max-width: 190px;
        }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <header>
        <p class="eyebrow">ARCADE · 001</p>
        <h1>贪吃<span>蛇</span></h1>
        <p class="intro">吃掉果实，别撞到自己。能拿到多少分？</p>
      </header>

      <section aria-label="游戏区域">
        <div class="scoreboard">
          <div>
            <span class="score-label">SCORE</span>
            <span class="score" id="score">00</span>
          </div>
          <div class="status" id="status" aria-live="polite">准备开始</div>
        </div>
        <div class="board-frame">
          <canvas id="board" aria-label="贪吃蛇游戏棋盘"></canvas>
        </div>
        <div class="actions">
          <button class="action action-primary" id="start" type="button">开始游戏</button>
          <button class="action action-secondary" id="restart" type="button">重新开始</button>
        </div>
      </section>

      <footer class="bottom-row">
        <p class="hint">方向键 / WASD 控制移动<br />空格键暂停 · 手机上可点方向键</p>
        <div class="dpad" aria-label="触屏方向键">
          <button class="direction up" data-direction="up" type="button" aria-label="向上">↑</button>
          <button class="direction left" data-direction="left" type="button" aria-label="向左">←</button>
          <button class="direction down" data-direction="down" type="button" aria-label="向下">↓</button>
          <button class="direction right" data-direction="right" type="button" aria-label="向右">→</button>
        </div>
      </footer>
    </main>

    <script>
      const SIZE = 24;
      const STEP_MS = 115;
      const canvas = document.querySelector("#board");
      const context = canvas.getContext("2d");
      const scoreElement = document.querySelector("#score");
      const statusElement = document.querySelector("#status");
      const startButton = document.querySelector("#start");
      const restartButton = document.querySelector("#restart");

      let snake;
      let direction;
      let nextDirection;
      let food;
      let score;
      let state = "ready";
      let timer;

      function placeFood() {
        const openCells = [];
        for (let y = 0; y < SIZE; y += 1) {
          for (let x = 0; x < SIZE; x += 1) {
            if (!snake.some((segment) => segment.x === x && segment.y === y)) {
              openCells.push({ x, y });
            }
          }
        }
        return openCells.length ? openCells[Math.floor(Math.random() * openCells.length)] : null;
      }

      function setStatus(message) {
        statusElement.textContent = message;
        startButton.textContent = state === "running" ? "暂停游戏" : state === "paused" ? "继续游戏" : "开始游戏";
      }

      function resetGame() {
        window.clearInterval(timer);
        snake = [
          { x: 7, y: 12 },
          { x: 6, y: 12 },
          { x: 5, y: 12 },
        ];
        direction = { x: 1, y: 0 };
        nextDirection = direction;
        score = 0;
        food = placeFood();
        state = "ready";
        scoreElement.textContent = "00";
        setStatus("准备开始");
        draw();
      }

      function startGame() {
        if (state === "running") {
          window.clearInterval(timer);
          state = "paused";
          setStatus("已暂停");
          return;
        }
        if (state === "over") resetGame();
        state = "running";
        setStatus("游戏进行中");
        timer = window.setInterval(tick, STEP_MS);
      }

      function changeDirection(name) {
        const choices = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 },
        };
        const candidate = choices[name];
        if (!candidate || candidate.x === -direction.x && candidate.y === -direction.y) return;
        nextDirection = candidate;
        if (state === "ready") startGame();
      }

      function tick() {
        direction = nextDirection;
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y,
        };
        const ateFood = head.x === food?.x && head.y === food?.y;
        const body = ateFood ? snake : snake.slice(0, -1);
        const hitWall = head.x < 0 || head.x >= SIZE || head.y < 0 || head.y >= SIZE;
        const hitSelf = body.some((segment) => segment.x === head.x && segment.y === head.y);

        if (hitWall || hitSelf) {
          window.clearInterval(timer);
          state = "over";
          setStatus("游戏结束 · 再试一次？");
          draw();
          return;
        }

        snake.unshift(head);
        if (ateFood) {
          score += 1;
          scoreElement.textContent = String(score).padStart(2, "0");
          food = placeFood();
          if (!food) {
            window.clearInterval(timer);
            state = "over";
            setStatus("太厉害了 · 棋盘已清空！");
          }
        } else {
          snake.pop();
        }
        draw();
      }

      function draw() {
        const bounds = canvas.getBoundingClientRect();
        const pixelRatio = window.devicePixelRatio || 1;
        const pixels = Math.max(1, Math.round(bounds.width * pixelRatio));
        if (canvas.width !== pixels || canvas.height !== pixels) {
          canvas.width = pixels;
          canvas.height = pixels;
        }
        const cell = pixels / SIZE;
        context.setTransform(cell, 0, 0, cell, 0, 0);
        context.clearRect(0, 0, SIZE, SIZE);

        context.strokeStyle = "rgb(197 226 177 / 5%)";
        context.lineWidth = 0.035;
        for (let i = 1; i < SIZE; i += 1) {
          context.beginPath();
          context.moveTo(i, 0);
          context.lineTo(i, SIZE);
          context.moveTo(0, i);
          context.lineTo(SIZE, i);
          context.stroke();
        }

        if (food) {
          context.fillStyle = "#ff826d";
          context.shadowColor = "rgb(255 130 109 / 60%)";
          context.shadowBlur = 0.55;
          context.beginPath();
          context.arc(food.x + 0.5, food.y + 0.5, 0.29, 0, Math.PI * 2);
          context.fill();
          context.shadowBlur = 0;
        }

        snake.forEach((segment, index) => {
          context.fillStyle = index === 0 ? "#d2ffab" : "#91d45b";
          context.beginPath();
          context.roundRect(segment.x + 0.07, segment.y + 0.07, 0.86, 0.86, 0.22);
          context.fill();
        });

        if (state === "ready" || state === "paused") {
          context.fillStyle = "rgb(10 15 9 / 48%)";
          context.fillRect(0, 0, SIZE, SIZE);
          context.fillStyle = "#eef4e8";
          context.textAlign = "center";
          context.textBaseline = "middle";
          context.font = "700 1.05px system-ui, sans-serif";
          context.fillText(state === "ready" ? "点击开始，准备出发" : "暂停中", SIZE / 2, SIZE / 2);
        }
      }

      startButton.addEventListener("click", startGame);
      restartButton.addEventListener("click", resetGame);
      document.querySelectorAll("[data-direction]").forEach((button) => {
        button.addEventListener("click", () => changeDirection(button.dataset.direction));
      });

      document.addEventListener("keydown", (event) => {
        const keys = {
          ArrowUp: "up",
          w: "up",
          W: "up",
          ArrowDown: "down",
          s: "down",
          S: "down",
          ArrowLeft: "left",
          a: "left",
          A: "left",
          ArrowRight: "right",
          d: "right",
          D: "right",
        };
        if (keys[event.key]) {
          event.preventDefault();
          changeDirection(keys[event.key]);
        } else if (event.code === "Space") {
          event.preventDefault();
          startGame();
        }
      });

      const resizeObserver = new ResizeObserver(draw);
      resizeObserver.observe(canvas);
      resetGame();
    </script>
  </body>
</html>
